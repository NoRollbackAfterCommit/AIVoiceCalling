[project]
name = "vaani"
version = "0.1.0"
description = "Vaani — open-source, self-hosted AI voice calling agent platform"
requires-python = ">=3.11"

# The base install is deliberately small: it is everything needed to run the
# full conversation loop with the mock providers, on a laptop, with no GPU.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Real speech + language models. Needs a GPU to be pleasant, works on CPU.
ai = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "webrtcvad>=2.0.10",
]
# Retrieval augmented generation against a real vector database.
rag = [
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "pypdf>=5.1",
]
# Production data plane.
prod = [
    "asyncpg>=0.30",
    "redis>=5.2",
    "prometheus-client>=0.21",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
vaani = "vaani.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vaani*"]

# The web console is served from the installed package, so it has to ship with
# it — a non-editable install would otherwise 404 on the root path.
[tool.setuptools.package-data]
vaani = ["web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
