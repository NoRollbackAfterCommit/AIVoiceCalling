# Full self-hosted stack. Nothing here calls out to the internet at runtime,
# which is the whole point for an on-premise or government-cloud deployment.
#
#   docker compose up -d                      # mock providers, SQLite, no GPU
#   docker compose --profile ai up -d         # + Ollama and Qdrant
#   docker compose --profile prod up -d       # + Postgres and Redis
#
# The default stack is the pilot: SQLite in a volume, no external data plane.
# Postgres needs the prod extra installed in the image (asyncpg), so it sits
# behind a profile rather than in the default path — otherwise a plain
# `docker compose up` fails at startup on a driver the image does not carry.
#
services:
  vaani:
    build: .
    container_name: vaani
    restart: unless-stopped
    ports:
      # Host 8090 rather than 8080: EnterpriseDB and several other Windows
      # installers claim 8080, and the collision presents as a container that
      # starts but never answers.
      - '${VAANI_HOST_PORT:-8090}:8080'   # HTTP API + WebSocket media
      - '9092:9092'                       # Asterisk AudioSocket
    environment:
      VAANI_HOST: 0.0.0.0
      VAANI_PORT: 8080
      VAANI_LOG_LEVEL: INFO
      # Switch these to the real providers once the ai profile is up.
      VAANI_STT_PROVIDER: ${VAANI_STT_PROVIDER:-mock}
      VAANI_LLM_PROVIDER: ${VAANI_LLM_PROVIDER:-mock}
      VAANI_TTS_PROVIDER: ${VAANI_TTS_PROVIDER:-mock}
      VAANI_LLM_BASE_URL: http://ollama:11434/v1
      VAANI_LLM_MODEL: ${VAANI_LLM_MODEL:-qwen2.5:7b-instruct}
      VAANI_VECTOR_STORE: ${VAANI_VECTOR_STORE:-memory}
      VAANI_QDRANT_URL: http://qdrant:6333
      # SQLite in the data volume by default. Point this at Postgres only with
      # an image built as `--build-arg EXTRAS='[prod]'`, which carries asyncpg.
      VAANI_DATABASE_URL: ${VAANI_DATABASE_URL:-sqlite+aiosqlite:////app/data/vaani.db}
      VAANI_REDIS_URL: ${VAANI_REDIS_URL:-}
    volumes:
      - vaani-data:/app/data
      - vaani-models:/app/models
      - ./knowledge:/app/knowledge:ro
    healthcheck:
      test: ['CMD', 'python', '-c',
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  postgres:
    image: postgres:17-alpine
    container_name: vaani-postgres
    restart: unless-stopped
    profiles: ['prod']
    environment:
      POSTGRES_USER: vaani
      POSTGRES_PASSWORD: vaani   # override in any real deployment
      POSTGRES_DB: vaani
    volumes:
      - vaani-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vaani']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vaani-redis
    restart: unless-stopped
    profiles: ['prod']
    command: redis-server --save '' --appendonly no
    volumes:
      - vaani-redis:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vaani-qdrant
    restart: unless-stopped
    profiles: ['ai']
    ports:
      - '6333:6333'
    volumes:
      - vaani-qdrant:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: vaani-ollama
    restart: unless-stopped
    profiles: ['ai']
    ports:
      - '11434:11434'
    volumes:
      - vaani-ollama:/root/.ollama
    # Remove this block on a CPU-only host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  vaani-data:
  vaani-models:
  vaani-postgres:
  vaani-redis:
  vaani-qdrant:
  vaani-ollama:
