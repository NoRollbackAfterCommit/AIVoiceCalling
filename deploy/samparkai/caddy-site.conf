# SamparkAI site block for the host Caddy. deploy.sh installs this as
# /etc/caddy/sites/samparkai.caddy and reloads Caddy, which picks it up through
# an `import /etc/caddy/sites/*.caddy` line in /etc/caddy/Caddyfile.
#
# Caddy obtains and renews the Let's Encrypt certificate by itself once DNS
# points samparkai.demosites.co.in at this box; until then the attempts retry
# in the background and the site answers nothing. Port 80 for this name only
# redirects, which Caddy does on its own for a named site. WebSockets (the
# browser call and the supervisor feed) proxy without extra configuration.
samparkai.demosites.co.in {
	header Strict-Transport-Security "max-age=31536000"
	reverse_proxy 127.0.0.1:8091
}
