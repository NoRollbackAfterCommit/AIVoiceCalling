# SamparkAI — the hosted-provider pilot on one AWS VM.
#
#   cd /opt/samparkai/deploy/samparkai
#   docker compose up -d --build
#
# One container. The VM already runs a host-level Caddy for another site, and
# that Caddy owns ports 80 and 443, so TLS for samparkai.demosites.co.in is a
# site block added to it (caddy-site.conf, installed by deploy.sh) rather than
# a second proxy. The app is published on loopback only: the host Caddy is the
# only way in from outside, and behind it the API token guard is the only way
# past the front page.
#
# The hosted tier needs no GPU, no Ollama, no Qdrant; Sarvam and the LLM are
# reached over HTTPS and the data plane is SQLite in a volume. Runtime settings
# come from .env beside this file (deploy.sh generates it with a fresh API
# token). VAANI_ENV=prod there means the app refuses to boot without one.
name: samparkai

services:
  samparkai:
    build:
      context: ../..
    image: samparkai:latest
    container_name: samparkai
    restart: unless-stopped
    env_file: .env
    environment:
      VAANI_HOST: 0.0.0.0
      VAANI_PORT: 8080
      VAANI_DATABASE_URL: sqlite+aiosqlite:////app/data/vaani.db
      # Telephony arrives later, with Asterisk on the same box; keep the
      # bridge off until the trunk exists.
      VAANI_AUDIOSOCKET_ENABLED: 'false'
    ports:
      # Loopback only. 8080 is taken by the other site's frontend.
      - '127.0.0.1:${SAMPARKAI_PORT:-8091}:8080'
    volumes:
      - samparkai-data:/app/data
      - ../../knowledge:/app/knowledge:ro
    healthcheck:
      test: ['CMD', 'python', '-c',
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  samparkai-data:
